<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="FLOW — The Future Land of Wonder. Explore original art, collectible merch, and imaginative experiences.">
<title>FLOW — The Future Land of Wonder</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="products.js"></script>
<style>
  @keyframes flow-spin { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }
  @keyframes flow-spin-slow { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(-360deg); } }
  @media (prefers-reduced-motion: no-preference) {
    .flow-mandala-spin { animation: flow-spin 140s linear infinite; }
    .flow-mandala-spin-slow { animation: flow-spin-slow 180s linear infinite; }
  }
  :focus-visible { outline: 3px solid #36e2ff; outline-offset: 4px; }
  .flow-skip-link { position: fixed; top: -100px; left: 16px; z-index: 100; padding: 10px 16px; border-radius: 999px; background: #36e2ff; color: #07060d; font-weight: 700; }
  .flow-skip-link:focus { top: 16px; }

  /* Industrial artist card: brushed steel, hazard stripe, rivets */
  .flow-artist-industrial {
    position: relative;
    overflow: hidden;
    padding: calc(clamp(24px,4vw,42px) + 10px) clamp(24px,4vw,42px) clamp(24px,4vw,42px);
    border-radius: 3px;
    border: 1px solid #3a3d44;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, #2b2e34 0%, #1b1d22 55%, #121317 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.45);
  }
  .flow-hazard {
    position: absolute; top: 0; left: 0; right: 0; height: 10px;
    background: repeating-linear-gradient(-45deg, #f4c20d 0 12px, #111 12px 24px);
    border-bottom: 1px solid #000;
  }
  .flow-rivet {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #9a9ea8, #4a4d55 60%, #24262b);
    box-shadow: 0 1px 1px rgba(0,0,0,.7);
  }
  .flow-rivet-tl { top: 20px; left: 12px; }
  .flow-rivet-tr { top: 20px; right: 12px; }
  .flow-rivet-bl { bottom: 12px; left: 12px; }
  .flow-rivet-br { bottom: 12px; right: 12px; }
  .flow-stencil-label {
    display: inline-block; margin: 0 0 14px; padding: 4px 10px;
    font-family: "Courier New", ui-monospace, monospace; font-weight: 700;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: #f4c20d; border: 1px dashed rgba(244,194,13,.55);
  }
</style>
</head>
<body style="margin:0;">
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#07060d"></rect><text x="50" y="58" text-anchor="middle" font-family="Impact, sans-serif" font-size="26" fill="#ff2d95">FLOW</text></svg>
</template>
<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html" hidden>
  <input type="hidden" name="form-name" value="contact">
  <input type="hidden" name="subject" value="New FLOW inquiry (%{submissionId})" data-remove-prefix>
  <input name="bot-field">
  <input type="text" name="name">
  <input type="email" name="email">
  <select name="topic"><option>General inquiry</option></select>
  <textarea name="message"></textarea>
</form>
<div id="root"></div>
<script type="text/babel" src="flow-site.jsx"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.FlowSite));
</script>
</body>
</html>
